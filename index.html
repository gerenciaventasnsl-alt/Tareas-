
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTask AI - Gestión Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Task Completion Animations */
        @keyframes strike {
            from { width: 0; }
            to { width: 100%; }
        }

        .completed-strike {
            position: relative;
            display: inline-block;
        }

        .completed-strike::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: currentColor;
            animation: strike 0.3s ease-out forwards;
            transform: translateY(-50%);
        }

        @keyframes check-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .animate-check {
            animation: check-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .task-card-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Imminent Task Animation */
        @keyframes pulse-red-border {
            0% { border-left-color: #dc2626; }
            50% { border-left-color: #fca5a5; }
            100% { border-left-color: #dc2626; }
        }

        .animate-pulse-red {
            animation: pulse-red-border 2s infinite;
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
